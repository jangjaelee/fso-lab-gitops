apiVersion: apps/v1
kind: Deployment
metadata:
  name: kust-app
  namespace: fso-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: kust-app}
  template:
    metadata:
      labels: {app: kust-app}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
